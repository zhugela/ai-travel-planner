# ============================================================
# AI 旅游规划助手 ai-travel-planner - 基础配置
# Chat: DeepSeek(OpenAI 兼容协议) | Embedding: 本地 ONNX
# ============================================================

# 服务端口与统一接口前缀
server:
  port: 8123
  servlet:
    context-path: /api

spring:
  ai:
    # 只启用 openai(DeepSeek 兼容)这一个 chat 模型,避免多 ChatModel Bean 冲突
    # embedding 由 LocalEmbeddingConfig 手动创建 Bean(1.0.0 无 transformers 自动装配)
    model:
      chat: openai
    # ========== DeepSeek(OpenAI 兼容) ==========
    openai:
      api-key: ${DEEPSEEK_API_KEY:${SCENECHOICE_DEEPSEEK_API_KEY:}}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
    # ========== 本地 ONNX Embedding(免 key,离线;文件预先放在 ~/.cache/bge-small-zh) ==========
    embedding:
      transformer:
        onnx:
          modelUri: file:${user.home}/.cache/bge-small-zh/model.onnx
          modelOutputName: last_hidden_state
        tokenizer:
          uri: file:${user.home}/.cache/bge-small-zh/tokenizer.json
    # ========== 本地 Ollama 保留但不自动装配 ==========
    ollama:
      chat:
        enabled: false
      embedding:
        enabled: false
    # ========== 百炼保留配置但不自动装配(账户欠费,切回时改 enabled=true) ==========
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        enabled: false
        options:
          model: qwen-plus
      embedding:
        enabled: false
        options:
          model: text-embedding-v3
    # MCP 客户端已禁用:本地 8127 端口的 image-search MCP 服务当前未启动,
    # 会导致 SseHttpClientTransport 创建时连不上 loopback 而启动失败
    mcp:
      client:
        enabled: false
#    mcp:
#      client:
#        sse:
#          connections:
#            image-search:
#              url: http://localhost:8127

# 在线接口文档
# 用 springdoc 原生 Swagger UI。
# knife4j 4.5.0 的 Knife4jOpenApiCustomizer 调用了 springdoc 2.8.9 已移除的
# SpringDocConfigProperties.getGroupConfigs(),会导致 /v3/api-docs 抛 NoSuchMethodError(500)。
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  # 关闭 knife4j 增强,避免与 springdoc 2.8.9 版本冲突
  enable: false

# 搜索 API 配置（SerpAPI）
# 搜索 API 配置
# provider: bocha(博查,国内直连,推荐) | serpapi(备用)
search-api:
  provider: ${SEARCH_API_PROVIDER:bocha}
  api-key: ${SEARCH_API_KEY:}

# 日志打印配置
logging:
  level:
    com.yupi.aitravelplanner: debug
    org.springframework.ai: debug