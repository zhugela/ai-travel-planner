# ============================================================
# 测试环境默认配置
# 所有 @SpringBootTest 自动加载此文件
# ============================================================

spring:
  profiles:
    active: test                                      # 默认激活 test profile
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:test-key}         # 测试用占位 Key
    ollama:
      chat:
        enabled: false
    mcp:
      client:
        enabled: false

# 搜索 API 配置
search-api:
  api-key: ${SEARCH_API_KEY:test-search-key}

logging:
  level:
    com.yupi.aitravelplanner: debug
